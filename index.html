<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Team Fatec - Escolha sua arte marcial</title>

    <!-- ÁREA DO CSS -->
    <style>
       
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fa; 
            color: #333;
        }

        /* 2. ESTILO DO CABEÇALHO */
        .cabecalho-principal {
            background-color: #000000; 
            color: white;
            padding: 20px;
            display: flex; 
            justify-content: space-between;
            align-items: center; 
        }

        /* Estilo dos links do menu */
        .menu ul {
            list-style: none; 
            display: flex; 
            gap: 20px;
        }

        .menu a {
            color: white;
            text-decoration: none; 
            font-weight: bold;
        }

        .menu a:hover {
            color: #ffffff;
        }

     
        .conteudo-principal {
            padding: 40px 20px;
            text-align: center; 
        }

        .titulo-pagina {
            margin-bottom: 30px;
            color: #ff9800;
        }

        /* 4. A MÁGICA DO FLEXBOX (Organizando as lutas) */
        .grade-de-lutas {
            display: flex; 
            justify-content: center; 
            gap: 30px; 
            flex-wrap: wrap; 
        }

        .cartao-luta {
            background-color: white;
            padding: 20px; 
            border-radius: 10px; 
            width: 300px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            transition: transform 0.3s; 
        }

        .cartao-luta:hover {
            transform: translateY(-10px); /* O cartão "pula" ao passar o mouse */
        }

        .cartao-luta img {
            width: 100%; /* A imagem ocupa 100% da largura do cartão */
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .luta-nome {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .luta-ingredientes {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
            height: 40px; /* Mantém os textos alinhados independente do tamanho */
        }

        .luta-preco {
            font-size: 1.4rem;
            font-weight: bold;
            color: #2e7d32; /* Verde para remeter a dinheiro/aprovação */
            margin-bottom: 20px;
        }

        /* 6. ESTILO DO BOTÃO */
        .botao-matricular-se {
            display: inline-block; /* Permite colocar padding num link */
            background-color: #ff9800; /* Amarelo/Laranja */
            color: #000;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 25px; /* Botão bem arredondado */
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .botao-matricular:hover {
            background-color: #e68a00; /* Escurece ao passar o mouse */
        }

        /* 7. RODAPÉ */
        .rodape-principal {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO DO SITE -->
    <header class="cabecalho-principal">
        <div class="logo">
            <!-- Trocado o logo por um texto simulando uma marca -->
            <h2>🥊 Team Fatec</h2>
        </div>
        <nav class="menu">
            <ul>
                <li><a href="#inicio">Início</a></li>
                <li><a href="#acervo">Acervo</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="conteudo-principal">
        <h1 class="titulo-pagina">Nossas Artes Marciais</h1>

        <div class="grade-de-lutas">

            <article class="cartao-luta">
                <img src="Foto boxe.png" alt="Foto boxe">
                <h2 class="luta-nome">Boxe</h2>
                <p class="luta-preco">R$ 100,00</p>
                <a href="#carrinho" class="botao-matricular-se">Matricular-se Agora</a>
            </article>

            <article class="cartao-luta">
                <img src="jiujitsu.png" alt="Foto jiujitsu">
                <h2 class="luta-nome">Boxe</h2>
                <p class="luta-preco">R$ 100,00</p>
                <a href="#carrinho" class="botao-matricular-se">Matricular-se Agora</a>
            </article>

            <article class="cartao-luta">
                <img src="muay thay.png" alt="Foto muaythay">
                <h2 class="luta-nome">Boxe</h2>
                <p class="luta-preco">R$ 100,00</p>
                <a href="#carrinho" class="botao-matricular-se">Matricular-se Agora</a>
            </article>

        </div>
    </main>

    <!-- RODAPÉ DO SITE -->
    <footer class="rodape-principal">
        <p>&copy; 2026 Team Fatec Pompéia. Todos os direitos reservados.</p>
        <p>Desenvolvido pelos alunos de Sistemas Inteligentes.</p>
    </footer>

</body>
</html>
